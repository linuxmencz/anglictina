<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Angličtina pro Čechy</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Angličtina">
  <script>
    // Ruční volba vzhledu se použije hned, aby stránka neprobliknula ve špatném režimu.
    try {
      var t = JSON.parse(localStorage.getItem('anglictina-v1')).settings.theme;
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button id="back" class="back" type="button" hidden>← Domů</button>
    <button id="home" class="brand" type="button"><img src="icons/icon-192.png" alt="" width="32" height="32">Angličtina</button>
    <div class="stats">
      <span id="streak" title="Série dní za sebou">🔥 0</span>
      <span id="xp" title="Body">⭐ 0</span>
    </div>
  </header>
  <main id="app" aria-live="polite"></main>

  <script src="js/data/words.js"></script>
  <script src="js/data/extras.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/recorder.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
